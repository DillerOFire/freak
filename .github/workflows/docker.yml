name: docker

on:
  push:
    branches: [master]
    tags: ["v*"]
  # Daily rebuild keeps yt-dlp (and other deps) fresh in the image without
  # requiring a code push.
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.10.9"
          python-version: "3.11"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked --dev

      - name: Run tests
        run: PYTHONPATH=. uv run pytest tests/ -q

  build:
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Write build metadata
        id: buildinfo
        run: |
          python3 scripts/write_build_info.py
          echo "commit=$(python3 -c 'import json; print(json.load(open(".build-info.json"))["commit"])')" >> "$GITHUB_OUTPUT"
          echo "short=$(python3 -c 'import json; print(json.load(open(".build-info.json"))["short"])')" >> "$GITHUB_OUTPUT"
          echo "subject=$(python3 -c 'import json; print(json.load(open(".build-info.json"))["subject"])')" >> "$GITHUB_OUTPUT"
          echo "date=$(python3 -c 'import json; print(json.load(open(".build-info.json"))["date"])')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      # Use repository_owner (not actor) for GHCR. If the package was first
      # published outside Actions, also grant this repo write access under the
      # package's "Manage Actions access" settings, or set a GHCR_TOKEN secret
      # (classic PAT with write:packages) for the repository.
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch,enable=${{ github.event_name != 'schedule' }}
            type=semver,pattern={{version}}
            type=sha,prefix=sha-,enable=${{ github.event_name != 'schedule' }}
            type=schedule,pattern=nightly
            type=schedule,pattern=nightly-{{date 'YYYYMMDD'}}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        id: build
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_COMMIT=${{ steps.buildinfo.outputs.commit }}
            GIT_COMMIT_SHORT=${{ steps.buildinfo.outputs.short }}
            GIT_COMMIT_SUBJECT=${{ steps.buildinfo.outputs.subject }}
            GIT_COMMIT_DATE=${{ steps.buildinfo.outputs.date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Write immutable promotion artifact
        run: |
          test -n '${{ steps.build.outputs.digest }}'
          printf 'FREAK_IMAGE=ghcr.io/dillerofire/freak@%s\n' \
            '${{ steps.build.outputs.digest }}' > image.env

      - name: Upload immutable promotion artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: freak-image-${{ github.run_id }}
          path: image.env
          retention-days: 30

      - name: Publish immutable master promotion release
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release="continuous-${GITHUB_SHA}"
          release_id="${{ steps.build.outputs.digest }}"
          test "${release_id#sha256:}" != "$release_id"
          printf '%s\n' "${release_id#sha256:}" > image.env.release-id
          if gh release view "$release" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            exit 0
          fi
          gh release create "$release" image.env image.env.release-id \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$release" \
            --notes "Immutable Freak image for ${GITHUB_SHA}."
